aid: nimble-storage
name: Nimble Storage
description: >-
  Nimble Storage is an enterprise flash and adaptive-flash storage platform,
  acquired by Hewlett Packard Enterprise in 2017 and now part of the HPE Nimble
  Storage / HPE Alletra 6000 product line. Its NimbleOS software exposes a
  REST API for programmatic management of arrays, storage pools, volumes,
  snapshots, initiator groups, and data-protection policies. The API is served
  per-array at https://<array>:5392/v1/ using session-token (X-Auth-Token)
  authentication, and HPE publishes first-party Python, Go, and Ansible client
  libraries for it. Originally venture-backed by Accel and Lightspeed Venture
  Partners, the company was added to the API Evangelist network and enriched
  from its public developer surface.

apis:
- name: NimbleOS REST API
  description: >-
    REST API served on each Nimble Storage array (NimbleOS 5.x) for managing
    arrays, pools, volumes, snapshots, volume/snapshot collections, protection
    templates, initiator groups, access control records, and performance
    policies. Object-set resources with standard GET/POST/PUT/DELETE operations
    over HTTPS, authenticated with a session token in the X-Auth-Token header.
